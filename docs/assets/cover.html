<!doctype html>
<!-- Source: rbadillap design contract v4.1. Rendered at 640×320, device scale 2. -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --background: #fafaf8; --border: #e4e4e7; --foreground: #52525b;
    --primary: #18181b; --muted-foreground: #a1a1aa;
    --text-2xs: 10.5px; --text-body: 15px; --text-lg: 20px;
  }
  html.dark {
    --background: #0a0a0a; --border: #27272a; --foreground: #a1a1aa;
    --primary: #d4d4d8; --muted-foreground: #71717a;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 640px; height: 320px; background: var(--background); }
  body { font-family: "Schibsted Grotesk", sans-serif; color: var(--foreground); padding: 44px 56px; position: relative; -webkit-font-smoothing: antialiased; }
  .top { display: flex; justify-content: space-between; align-items: flex-end; }
  .mark { color: var(--primary); display: block; }
  .label { font-family: "JetBrains Mono", monospace; font-size: var(--text-2xs); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted-foreground); white-space: nowrap; }
  h1 { color: var(--primary); font-size: var(--text-lg); font-weight: 500; letter-spacing: -0.01em; margin: 28px 0 6px; }
  p { font-size: var(--text-body); line-height: 1.65; }
  .cycle { position: absolute; left: 80px; right: 80px; bottom: 44px; height: 92px; }
  .cycle svg { position: absolute; inset: 0; overflow: visible; }
  .stages { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; }
  .stages .label { width: 0; display: flex; justify-content: center; }
</style>
</head>
<body>
  <div class="top">
    <svg class="mark" width="150" height="42" viewBox="0 0 150 42" fill="none" aria-hidden="true">
      <line x1="0" y1="34" x2="150" y2="34" stroke="currentColor" stroke-width="1" opacity="0.9" />
      <path d="M 49 34 A 26 26 0 0 1 101 34" stroke="currentColor" stroke-width="1.4" fill="none" />
      <circle cx="49" cy="34" r="2.4" fill="currentColor" />
      <circle cx="101" cy="34" r="2.4" fill="currentColor" />
      <circle cx="75" cy="8" r="1.6" fill="currentColor" />
    </svg>
    <span class="label">rbadillap/sre</span>
  </div>
  <h1>sre</h1>
  <p>A senior SRE's method, packaged as agent skills.</p>
  <div class="cycle">
    <!-- 528 wide: six stages on the base; the return from learn to define is the loop. -->
    <svg viewBox="0 0 480 92" width="480" height="92" fill="none" aria-hidden="true">
      <path d="M 480 62 A 240 50 0 0 0 0 62" stroke="var(--border)" stroke-width="1" fill="none" />
      <line x1="0" y1="62" x2="480" y2="62" stroke="var(--muted-foreground)" stroke-width="1" />
      <circle cx="0" cy="62" r="2.5" fill="var(--primary)" />
      <circle cx="96" cy="62" r="2.5" fill="var(--primary)" />
      <circle cx="192" cy="62" r="2.5" fill="var(--primary)" />
      <circle cx="288" cy="62" r="2.5" fill="var(--primary)" />
      <circle cx="384" cy="62" r="2.5" fill="var(--primary)" />
      <circle cx="480" cy="62" r="2.5" fill="var(--primary)" />
    </svg>
    <div class="stages">
      <span class="label">Define</span><span class="label">Design</span><span class="label">Ship</span>
      <span class="label">Observe</span><span class="label">Respond</span><span class="label">Learn</span>
    </div>
  </div>
</body>
<script>if (location.hash === "#dark") document.documentElement.classList.add("dark");</script>
</html>
